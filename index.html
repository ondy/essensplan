<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essensplanung</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div>
          <p class="app__eyebrow">Essensplanung</p>
          <h1 class="app__title">Dein Wochenüberblick</h1>
        </div>
        <div class="app__meta">
          <span class="app__meta-label">Desktop Ansicht</span>
          <span class="app__meta-dot"></span>
          <span class="app__meta-label" id="today-label">Heute</span>
        </div>
      </header>

      <section class="days" id="days"></section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
